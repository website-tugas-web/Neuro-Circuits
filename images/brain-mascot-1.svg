<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Stage 1: Kid brain - slightly bigger, holding small book/crayon, kid-like grin -->
  <defs>
    <radialGradient id="kidBrainGradient" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#ff99cc" />
    </radialGradient>
  </defs>

  <!-- Main brain body - slightly larger -->
  <ellipse cx="60" cy="60" rx="40" ry="44" fill="url(#kidBrainGradient)" stroke="#ff66b3" stroke-width="2"/>

  <!-- Brain convolutions -->
  <path d="M 32 48 Q 38 43 44 48" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 76 48 Q 82 43 88 48" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 35 65 Q 42 60 49 65" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 71 65 Q 78 60 85 65" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>

  <!-- Happy eyes -->
  <circle cx="47" cy="55" r="7" fill="white"/>
  <circle cx="73" cy="55" r="7" fill="white"/>
  <circle cx="47" cy="55" r="4" fill="#333"/>
  <circle cx="73" cy="55" r="4" fill="#333"/>
  <circle cx="49" cy="53" r="1.5" fill="white"/>
  <circle cx="75" cy="53" r="1.5" fill="white"/>

  <!-- Kid-like grin -->
  <path d="M 45 75 Q 60 82 75 75" fill="none" stroke="#ff66b3" stroke-width="2" stroke-linecap="round"/>

  <!-- Small book in hand (lower right) -->
  <g transform="translate(85, 95)">
    <rect x="0" y="0" width="18" height="24" rx="1" fill="#6699ff" stroke="#4477cc" stroke-width="1"/>
    <line x1="3" y1="6" x2="15" y2="6" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="3" y1="10" x2="15" y2="10" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="3" y1="14" x2="12" y2="14" stroke="white" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Crayon in other hand (lower left) -->
  <g transform="translate(12, 100)">
    <rect x="0" y="0" width="4" height="20" rx="1" fill="#ff6666"/>
    <polygon points="2,20 0,24 4,24" fill="#333"/>
  </g>
</svg>
