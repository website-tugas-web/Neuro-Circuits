<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Stage 3: Teen brain - taller, reading glasses, holding textbook -->
  <defs>
    <radialGradient id="teenBrainGradient" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#ff99cc" />
    </radialGradient>
  </defs>

  <!-- Main brain body - even taller -->
  <ellipse cx="60" cy="52" rx="43" ry="48" fill="url(#teenBrainGradient)" stroke="#ff66b3" stroke-width="2"/>

  <!-- More defined brain convolutions -->
  <path d="M 28 38 Q 34 33 40 38" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 80 38 Q 86 33 92 38" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 30 52 Q 38 47 46 52" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 74 52 Q 82 47 90 52" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 32 66 Q 40 62 48 66" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 72 66 Q 80 62 88 66" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>

  <!-- Studious eyes -->
  <circle cx="45" cy="47" r="6" fill="white"/>
  <circle cx="75" cy="47" r="6" fill="white"/>
  <circle cx="45" cy="47" r="3.5" fill="#333"/>
  <circle cx="75" cy="47" r="3.5" fill="#333"/>

  <!-- Reading glasses -->
  <circle cx="45" cy="47" r="10" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="75" cy="47" r="10" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="55" y1="47" x2="65" y2="47" stroke="#555" stroke-width="2"/>

  <!-- Focused smile -->
  <path d="M 42 70 Q 60 74 78 70" fill="none" stroke="#ff66b3" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Large textbook -->
  <g transform="translate(25, 105)">
    <rect x="0" y="0" width="70" height="50" rx="2" fill="#3366cc" stroke="#224488" stroke-width="2"/>
    <text x="35" y="20" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">BIOLOGY</text>
    <text x="35" y="32" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Textbook</text>
    <rect x="5" y="5" width="60" height="8" rx="1" fill="white" opacity="0.3"/>
  </g>
</svg>
