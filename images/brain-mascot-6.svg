<svg viewBox="0 0 130 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Stage 6: Junior doctor/intern - white coat over UGM almamater, stethoscope -->
  <defs>
    <radialGradient id="doctorBrainGradient" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#ff99cc" />
    </radialGradient>
    <linearGradient id="almamaterGold6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4d03f" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>

  <!-- White coat (open, showing almamater underneath) -->
  <g transform="translate(0, 70)">
    <!-- White coat left side -->
    <path d="M 20 0 L 20 95 L 35 90 L 45 95" fill="white" stroke="#ccc" stroke-width="2"/>
    <!-- White coat right side -->
    <path d="M 110 0 L 110 95 L 95 90 L 85 95" fill="white" stroke="#ccc" stroke-width="2"/>

    <!-- Almamater visible underneath (center) -->
    <path d="M 40 5 L 40 85 L 50 82 L 65 86 L 80 82 L 90 85 L 90 5" fill="url(#almamaterGold6)" stroke="#b8941f" stroke-width="1.5"/>

    <!-- UGM Badge visible on almamater -->
    <g transform="translate(50, 18)">
      <circle cx="0" cy="0" r="8" fill="#7B1224" stroke="#d4af37" stroke-width="1.5"/>
      <text x="0" y="2.5" font-family="serif" font-size="7" fill="#d4af37" text-anchor="middle" font-weight="bold">UGM</text>
    </g>

    <!-- White coat collar -->
    <path d="M 20 0 L 35 15 L 50 8" fill="white" stroke="#ccc" stroke-width="1.5"/>
    <path d="M 110 0 L 95 15 L 80 8" fill="white" stroke="#ccc" stroke-width="1.5"/>

    <!-- Coat pockets -->
    <rect x="22" y="50" width="18" height="15" rx="2" fill="none" stroke="#ccc" stroke-width="1.5"/>
    <rect x="90" y="50" width="18" height="15" rx="2" fill="none" stroke="#ccc" stroke-width="1.5"/>
  </g>

  <!-- Main brain body -->
  <ellipse cx="65" cy="42" rx="46" ry="50" fill="url(#doctorBrainGradient)" stroke="#ff66b3" stroke-width="2"/>

  <!-- Brain convolutions (professional) -->
  <path d="M 30 28 Q 36 23 42 28" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.65"/>
  <path d="M 88 28 Q 94 23 100 28" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.65"/>
  <path d="M 28 42 Q 36 37 44 42" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.65"/>
  <path d="M 86 42 Q 94 37 102 42" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.65"/>
  <path d="M 31 56 Q 39 52 47 56" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.65"/>
  <path d="M 83 56 Q 91 52 99 56" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.65"/>

  <!-- Professional eyes -->
  <circle cx="46" cy="38" r="6" fill="white"/>
  <circle cx="84" cy="38" r="6" fill="white"/>
  <circle cx="46" cy="38" r="3.5" fill="#333"/>
  <circle cx="84" cy="38" r="3.5" fill="#333"/>
  <circle cx="48" cy="36" r="1.5" fill="white"/>
  <circle cx="86" cy="36" r="1.5" fill="white"/>

  <!-- Professional smile -->
  <path d="M 42 60 Q 65 66 88 60" fill="none" stroke="#ff66b3" stroke-width="2" stroke-linecap="round"/>

  <!-- Stethoscope around neck -->
  <path d="M 30 65 Q 35 75 45 80 Q 65 90 85 80 Q 95 75 100 65" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <circle cx="30" cy="65" r="4" fill="#555" stroke="#333" stroke-width="1.5"/>
  <circle cx="100" cy="65" r="4" fill="#555" stroke="#333" stroke-width="1.5"/>
  <circle cx="65" cy="92" r="6" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="65" cy="92" r="4" fill="#777"/>
</svg>
