<svg viewBox="0 0 130 190" xmlns="http://www.w3.org/2000/svg">
  <!-- Stage 7: Doctor - full white coat, stethoscope, confident smile, graduation cap, celebration glow -->
  <defs>
    <radialGradient id="doctorFinalGradient" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#ff99cc" />
    </radialGradient>
    <radialGradient id="celebrationGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Celebration glow -->
  <circle cx="65" cy="95" r="70" fill="url(#celebrationGlow)"/>

  <!-- Sparkles -->
  <g fill="#ffd700" opacity="0.8">
    <circle cx="20" cy="40" r="2"/>
    <circle cx="110" cy="35" r="2.5"/>
    <circle cx="15" cy="80" r="1.5"/>
    <circle cx="115" cy="75" r="2"/>
    <circle cx="25" cy="120" r="2"/>
    <circle cx="105" cy="125" r="1.8"/>
  </g>

  <!-- Medical/graduation cap -->
  <g transform="translate(35, 10)">
    <rect x="0" y="8" width="60" height="4" rx="1" fill="#333"/>
    <polygon points="30,0 10,8 50,8" fill="#333"/>
    <rect x="58" y="8" width="2" height="15" fill="#d4af37"/>
    <circle cx="59" cy="24" r="2" fill="#d4af37"/>
  </g>

  <!-- Full white coat (closed, professional) -->
  <g transform="translate(15, 75)">
    <!-- Main coat body -->
    <path d="M 10 0 L 10 95 L 25 92 L 50 97 L 75 92 L 90 95 L 90 0 Z" fill="white" stroke="#ddd" stroke-width="2"/>

    <!-- Collar -->
    <path d="M 10 0 L 25 18 L 50 10 L 75 18 L 90 0" fill="white" stroke="#ddd" stroke-width="1.8"/>

    <!-- Buttons -->
    <circle cx="50" cy="28" r="2.5" fill="#aaa"/>
    <circle cx="50" cy="44" r="2.5" fill="#aaa"/>
    <circle cx="50" cy="60" r="2.5" fill="#aaa"/>
    <circle cx="50" cy="76" r="2.5" fill="#aaa"/>

    <!-- Pockets with detail -->
    <rect x="15" y="52" width="22" height="18" rx="2" fill="none" stroke="#ccc" stroke-width="1.5"/>
    <rect x="63" y="52" width="22" height="18" rx="2" fill="none" stroke="#ccc" stroke-width="1.5"/>
    <line x1="18" y1="55" x2="34" y2="55" stroke="#eee" stroke-width="1"/>
    <line x1="66" y1="55" x2="82" y2="55" stroke="#eee" stroke-width="1"/>

    <!-- Lapels -->
    <line x1="25" y1="12" x2="32" y2="50" stroke="#ddd" stroke-width="1.5"/>
    <line x1="75" y1="12" x2="68" y2="50" stroke="#ddd" stroke-width="1.5"/>
  </g>

  <!-- Main brain body (mature, confident) -->
  <ellipse cx="65" cy="48" rx="47" ry="52" fill="url(#doctorFinalGradient)" stroke="#ff66b3" stroke-width="2.5"/>

  <!-- Detailed brain convolutions (fully developed) -->
  <path d="M 28 32 Q 34 27 40 32" fill="none" stroke="#ff66b3" stroke-width="1.6" opacity="0.7"/>
  <path d="M 90 32 Q 96 27 102 32" fill="none" stroke="#ff66b3" stroke-width="1.6" opacity="0.7"/>
  <path d="M 26 48 Q 34 43 42 48" fill="none" stroke="#ff66b3" stroke-width="1.6" opacity="0.7"/>
  <path d="M 88 48 Q 96 43 104 48" fill="none" stroke="#ff66b3" stroke-width="1.6" opacity="0.7"/>
  <path d="M 29 62 Q 37 58 45 62" fill="none" stroke="#ff66b3" stroke-width="1.6" opacity="0.7"/>
  <path d="M 85 62 Q 93 58 101 62" fill="none" stroke="#ff66b3" stroke-width="1.6" opacity="0.7"/>
  <path d="M 33 75 Q 41 72 49 75" fill="none" stroke="#ff66b3" stroke-width="1.6" opacity="0.7"/>

  <!-- Wise, confident eyes -->
  <circle cx="47" cy="42" r="7" fill="white"/>
  <circle cx="83" cy="42" r="7" fill="white"/>
  <circle cx="47" cy="42" r="4" fill="#333"/>
  <circle cx="83" cy="42" r="4" fill="#333"/>
  <circle cx="49" cy="40" r="2" fill="white"/>
  <circle cx="85" cy="40" r="2" fill="white"/>

  <!-- Big confident smile (achievement) -->
  <path d="M 40 66 Q 65 74 90 66" fill="none" stroke="#ff66b3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 44 68 Q 65 74 86 68" fill="#ff99cc" opacity="0.3"/>

  <!-- Professional stethoscope -->
  <path d="M 28 72 Q 33 82 43 88 Q 65 100 87 88 Q 97 82 102 72" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="28" cy="72" r="4.5" fill="#444" stroke="#222" stroke-width="1.5"/>
  <circle cx="102" cy="72" r="4.5" fill="#444" stroke="#222" stroke-width="1.5"/>
  <circle cx="65" cy="102" r="7" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="65" cy="102" r="5" fill="#666"/>
</svg>
