<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 160 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doctor brain mascot - stage 7 of 7">
  <title>Stage 7 - Doctor: full white coat, stethoscope, graduation cap, celebration glow</title>
  <defs>
    <radialGradient id="brain" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffd2dc"/>
      <stop offset="55%" stop-color="#f4a8b8"/>
      <stop offset="100%" stop-color="#d97a92"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7c2" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffe066" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whiteCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde4ec"/>
    </linearGradient>
  </defs>
  <!-- Glow halo -->
  <circle cx="80" cy="100" r="92" fill="url(#glow)"/>
  <g fill="#ffe066" stroke="#e0a916" stroke-width="0.8">
    <polygon points="20,30 22,36 28,38 22,40 20,46 18,40 12,38 18,36" />
    <polygon points="140,30 142,36 148,38 142,40 140,46 138,40 132,38 138,36" />
    <polygon points="14,150 16,154 20,156 16,158 14,162 12,158 8,156 12,154" />
    <polygon points="146,150 148,154 152,156 148,158 146,162 144,158 140,156 144,154" />
    <circle cx="32" cy="80" r="2.5"/>
    <circle cx="128" cy="80" r="2.5"/>
    <circle cx="50" cy="14" r="1.8"/>
    <circle cx="110" cy="14" r="1.8"/>
  </g>
  <!-- Blue inner V-neck shirt visible through white coat -->
  <path d="M 60,108 L 80,148 L 100,108 L 96,108 L 80,144 L 64,108 Z" fill="#3a85b0" stroke="#1c4f70" stroke-width="1"/>
  <!-- White coat body, top edge tucks under brain underside -->
  <path d="M 28,100
          L 8,218
          L 152,218
          L 132,100
          Q 128,104 122,108
          C 108,114 96,114 88,108
          L 80,108
          L 72,108
          C 64,114 52,114 46,108
          Q 32,104 28,100 Z"
          fill="url(#whiteCoat)" stroke="#7a8da1" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- White coat lapels -->
  <path d="M 38,108 L 56,108 L 76,140 L 80,148 L 72,148 L 54,128 Z" fill="#f0f4f8" stroke="#7a8da1" stroke-width="1.2"/>
  <path d="M 122,108 L 104,108 L 84,140 L 80,148 L 88,148 L 106,128 Z" fill="#f0f4f8" stroke="#7a8da1" stroke-width="1.2"/>
  <!-- Left coat sleeve (at side) -->
  <path d="M 28,100
          Q 10,118 4,150
          Q 0,170 8,180
          L 26,180
          Q 30,170 30,150
          Q 34,118 38,108 Z"
          fill="url(#whiteCoat)" stroke="#7a8da1" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M 6,174 Q 18,180 28,174" stroke="#7a8da1" stroke-width="1.3" fill="none"/>
  <circle cx="16" cy="186" r="6" fill="url(#brain)" stroke="#7a3f50" stroke-width="1.5"/>
  <!-- Right coat sleeve (waving) -->
  <path d="M 132,100
          Q 152,108 158,90
          Q 164,72 156,62
          L 142,58
          Q 134,72 130,86
          Q 126,100 122,108 Z"
          fill="url(#whiteCoat)" stroke="#7a8da1" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M 142,60 Q 150,58 156,62" stroke="#7a8da1" stroke-width="1.3" fill="none"/>
  <circle cx="150" cy="50" r="6" fill="url(#brain)" stroke="#7a3f50" stroke-width="1.5"/>
  <!-- Coat buttons -->
  <circle cx="80" cy="166" r="2.4" fill="#bcc6d4" stroke="#7a8da1" stroke-width="0.6"/>
  <circle cx="80" cy="184" r="2.4" fill="#bcc6d4" stroke="#7a8da1" stroke-width="0.6"/>
  <circle cx="80" cy="202" r="2.4" fill="#bcc6d4" stroke="#7a8da1" stroke-width="0.6"/>
  <!-- Breast pocket with M.D. label -->
  <rect x="100" y="170" width="22" height="16" rx="1.5" fill="none" stroke="#7a8da1" stroke-width="1.2"/>
  <text x="111" y="181" font-family="Georgia, serif" font-size="6" font-weight="bold" fill="#7a8da1" text-anchor="middle">M.D.</text>
  <!-- Stethoscope draped on collar onto coat -->
  <path d="M 46,108 Q 38,140 50,170 Q 64,186 80,180 Q 96,186 110,170 Q 122,140 114,108"
        stroke="#2c3e50" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="46" cy="108" r="2.6" fill="#34495e" stroke="#1a242e" stroke-width="0.6"/>
  <circle cx="114" cy="108" r="2.6" fill="#34495e" stroke="#1a242e" stroke-width="0.6"/>
  <circle cx="80" cy="186" r="7.5" fill="#566d83" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="80" cy="186" r="4" fill="#34495e"/>
  <circle cx="78" cy="184" r="1.4" fill="#7a8da1"/>
  <!-- Brain underside ellipse and tongue -->
  <ellipse cx="80" cy="103" rx="40" ry="12" fill="#d987a0" stroke="#7a3f50" stroke-width="2"/>
  <path d="M44,103 Q52,98 60,104 Q68,98 76,104 Q84,98 92,104 Q100,98 108,104 Q114,99 116,103" stroke="#7a3f50" stroke-width="1.2" fill="none" opacity="0.65"/>
  <rect x="74" y="113" width="12" height="11" rx="5" fill="#c5687f" stroke="#7a3f50" stroke-width="1.5"/>
  <!-- Brain lobes -->
  <path d="M 80,12 C 65,10 50,16 42,28 C 30,30 22,42 28,54 C 18,58 16,76 28,86 C 22,98 32,108 46,108 C 52,114 64,114 72,108 C 76,112 80,112 80,108 Z" fill="url(#brain)" stroke="#7a3f50" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 80,12 C 95,10 110,16 118,28 C 130,30 138,42 132,54 C 142,58 144,76 132,86 C 138,98 128,108 114,108 C 108,114 96,114 88,108 C 84,112 80,112 80,108 Z" fill="url(#brain)" stroke="#7a3f50" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 42,28 Q 47,22 53,28 Q 60,22 66,28 Q 73,22 80,28 Q 87,22 94,28 Q 100,22 107,28 Q 113,22 118,28" stroke="#7a3f50" stroke-width="1.6" fill="none" opacity="0.6"/>
  <path d="M 80,12 Q 79,40 80,72 Q 81,98 80,108" stroke="#7a3f50" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  <path d="M 32,48 Q 44,46 42,56 Q 30,60 38,70 Q 50,68 46,80" stroke="#7a3f50" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 50,42 Q 58,48 50,55" stroke="#7a3f50" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 62,82 Q 70,80 66,90" stroke="#7a3f50" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 128,48 Q 116,46 118,56 Q 130,60 122,70 Q 110,68 114,80" stroke="#7a3f50" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 110,42 Q 102,48 110,55" stroke="#7a3f50" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 98,82 Q 90,80 94,90" stroke="#7a3f50" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  <ellipse cx="56" cy="32" rx="18" ry="10" fill="white" opacity="0.32"/>
  <!-- Graduation cap on top of brain -->
  <g transform="translate(80, 8)">
    <polygon points="-26,4 26,4 0,-12" fill="#1a1a2e" stroke="#000" stroke-width="1.2"/>
    <rect x="-22" y="2" width="44" height="6" rx="1" fill="#1a1a2e" stroke="#000" stroke-width="1.2"/>
    <line x1="0" y1="-8" x2="22" y2="2" stroke="#f4c430" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="22" cy="2" r="3.5" fill="#f4c430" stroke="#a07a0e" stroke-width="0.8"/>
    <line x1="20" y1="2.5" x2="24" y2="6" stroke="#a07a0e" stroke-width="1"/>
    <line x1="22" y1="2" x2="22" y2="7" stroke="#a07a0e" stroke-width="1"/>
    <line x1="24" y1="2.5" x2="20" y2="6" stroke="#a07a0e" stroke-width="1"/>
  </g>
  <!-- Eyes -->
  <circle cx="62" cy="60" r="9" fill="white" stroke="#7a3f50" stroke-width="1.2"/>
  <circle cx="98" cy="60" r="9" fill="white" stroke="#7a3f50" stroke-width="1.2"/>
  <circle cx="63" cy="61" r="4.5" fill="#222234"/>
  <circle cx="99" cy="61" r="4.5" fill="#222234"/>
  <circle cx="65" cy="58" r="1.8" fill="white"/>
  <circle cx="101" cy="58" r="1.8" fill="white"/>
  <!-- Big proud smile -->
  <path d="M 60,84 Q 80,98 100,84" stroke="#7a3f50" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M 64,86 Q 80,94 96,86" stroke="#ff5577" stroke-width="1.5" fill="#ff8aa3" stroke-linecap="round"/>
</svg>
