<svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
  <!-- Stage 4: Freshman med student - UGM almamater (yellow-gold blazer with UGM badge), nervous smile -->
  <defs>
    <radialGradient id="medBrainGradient" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#ff99cc" />
    </radialGradient>
    <linearGradient id="almamaterGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4d03f" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>

  <!-- UGM Almamater blazer body -->
  <g transform="translate(0, 65)">
    <!-- Main blazer -->
    <path d="M 30 0 L 30 80 L 45 75 L 60 80 L 75 75 L 90 80 L 90 0 Z" fill="url(#almamaterGold)" stroke="#b8941f" stroke-width="2"/>

    <!-- Collar -->
    <path d="M 30 0 L 42 15 L 60 8 L 78 15 L 90 0" fill="url(#almamaterGold)" stroke="#b8941f" stroke-width="1.5"/>

    <!-- Buttons -->
    <circle cx="60" cy="25" r="2.5" fill="#b8941f"/>
    <circle cx="60" cy="38" r="2.5" fill="#b8941f"/>
    <circle cx="60" cy="51" r="2.5" fill="#b8941f"/>

    <!-- UGM Badge on left chest -->
    <g transform="translate(40, 10)">
      <circle cx="0" cy="0" r="8" fill="#7B1224" stroke="#d4af37" stroke-width="1.5"/>
      <text x="0" y="2" font-family="serif" font-size="7" fill="#d4af37" text-anchor="middle" font-weight="bold">UGM</text>
    </g>

    <!-- Lapels detail -->
    <line x1="42" y1="10" x2="48" y2="35" stroke="#b8941f" stroke-width="1.5"/>
    <line x1="78" y1="10" x2="72" y2="35" stroke="#b8941f" stroke-width="1.5"/>
  </g>

  <!-- Main brain body -->
  <ellipse cx="60" cy="45" rx="44" ry="48" fill="url(#medBrainGradient)" stroke="#ff66b3" stroke-width="2"/>

  <!-- Brain convolutions -->
  <path d="M 27 32 Q 33 27 39 32" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 81 32 Q 87 27 93 32" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 28 45 Q 36 40 44 45" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 76 45 Q 84 40 92 45" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>

  <!-- Slightly nervous eyes -->
  <circle cx="44" cy="42" r="6" fill="white"/>
  <circle cx="76" cy="42" r="6" fill="white"/>
  <circle cx="44" cy="43" r="3.5" fill="#333"/>
  <circle cx="76" cy="43" r="3.5" fill="#333"/>
  <circle cx="46" cy="41" r="1.5" fill="white"/>
  <circle cx="78" cy="41" r="1.5" fill="white"/>

  <!-- Nervous smile (slightly asymmetric) -->
  <path d="M 40 62 Q 58 67 77 63" fill="none" stroke="#ff66b3" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sweat drop (nervousness) -->
  <ellipse cx="95" cy="35" rx="3" ry="4" fill="#99ccff" opacity="0.7"/>
</svg>
