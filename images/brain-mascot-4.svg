      <polygon points="10,0 7,-0.8 7,0.8"/>
      <polygon points="8.66,5 6.06,3.6 7.13,2.04"/>
      <polygon points="5,8.66 3.6,6.06 2.04,7.13"/>
      <polygon points="0,10 0.8,7 -0.8,7"/>
      <polygon points="-5,8.66 -3.6,6.06 -2.04,7.13"/>
      <polygon points="-8.66,5 -6.06,3.6 -7.13,2.04"/>
      <polygon points="-10,0 -7,-0.8 -7,0.8"/>
      <polygon points="-8.66,-5 -6.06,-3.6 -7.13,-2.04"/>
