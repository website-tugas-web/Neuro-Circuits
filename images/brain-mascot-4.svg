  <circle cx="98" cy="60" r="9" fill="white" stroke="#7a3f50" stroke-width="1.2"/>
  <circle cx="63" cy="62" r="4" fill="#222234"/>
  <circle cx="99" cy="62" r="4" fill="#222234"/>
  <circle cx="65" cy="59" r="1.5" fill="white"/>
  <circle cx="101" cy="59" r="1.5" fill="white"/>
