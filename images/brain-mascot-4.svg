<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 160 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Freshman med student brain mascot in UGM almamater - stage 4 of 7">
  <title>Stage 4 - Freshman med student wearing the UGM yellow-gold almamater</title>
  <defs>
    <radialGradient id="brain" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffd2dc"/>
      <stop offset="55%" stop-color="#f4a8b8"/>
      <stop offset="100%" stop-color="#d97a92"/>
    </radialGradient>
    <linearGradient id="goldBlazer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5cf3a"/>
      <stop offset="55%" stop-color="#e0a916"/>
      <stop offset="100%" stop-color="#a87b0a"/>
    </linearGradient>
    <linearGradient id="goldHilite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde576"/>
      <stop offset="100%" stop-color="#e6b520"/>
    </linearGradient>
  </defs>
  <!-- Blazer body, top edge tucks under brain underside (no gap) -->
  <path d="M 28,100
          L 14,218
          L 146,218
          L 132,100
          Q 128,104 122,108
