<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schoolkid brain mascot with backpack - stage 2 of 7">
  <title>Stage 2 - Schoolkid brain with backpack</title>
  <defs>
    <radialGradient id="brain" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffd2dc"/>
      <stop offset="55%" stop-color="#f4a8b8"/>
      <stop offset="100%" stop-color="#d97a92"/>
    </radialGradient>
    <linearGradient id="bag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ea1d3"/>
      <stop offset="100%" stop-color="#2c6f9a"/>
    </linearGradient>
    <linearGradient id="bagFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5fb3e0"/>
      <stop offset="100%" stop-color="#3a85b0"/>
    </linearGradient>
    <linearGradient id="shorts" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c8fbe"/>
      <stop offset="100%" stop-color="#3d5e8a"/>
    </linearGradient>
  </defs>
  <!-- Backpack body BEHIND the brain. Sized smaller so brain stays the main shape. -->
  <rect x="48" y="78" width="64" height="68" rx="9" fill="url(#bag)" stroke="#1c4f70" stroke-width="2"/>
  <!-- Top flap of backpack (visible only above brain shoulders won't render — brain wraps wide; flap fills upper bag) -->
  <path d="M 52,78 Q 52,68 62,68 L 98,68 Q 108,68 108,78 L 108,90 L 52,90 Z" fill="url(#bagFlap)" stroke="#1c4f70" stroke-width="1.6"/>
  <!-- Buckle on flap -->
  <rect x="74" y="80" width="12" height="6" rx="1.5" fill="#f4d04a" stroke="#1c4f70" stroke-width="0.9"/>
  <!-- Front pocket (visible below brain) -->
  <rect x="58" y="118" width="44" height="22" rx="3" fill="#1c4f70" opacity="0.5"/>
  <rect x="64" y="122" width="32" height="3" rx="1.5" fill="#aee0f3"/>
  <circle cx="98" cy="132" r="2.4" fill="#f4d04a" stroke="#1c4f70" stroke-width="0.8"/>
  <!-- Brain underside ellipse and tongue -->
  <ellipse cx="80" cy="103" rx="40" ry="12" fill="#d987a0" stroke="#7a3f50" stroke-width="2"/>
  <path d="M44,103 Q52,98 60,104 Q68,98 76,104 Q84,98 92,104 Q100,98 108,104 Q114,99 116,103" stroke="#7a3f50" stroke-width="1.2" fill="none" opacity="0.65"/>
  <rect x="74" y="113" width="12" height="11" rx="5" fill="#c5687f" stroke="#7a3f50" stroke-width="1.5"/>
  <!-- Brain lobes -->
  <path d="M 80,12 C 65,10 50,16 42,28 C 30,30 22,42 28,54 C 18,58 16,76 28,86 C 22,98 32,108 46,108 C 52,114 64,114 72,108 C 76,112 80,112 80,108 Z" fill="url(#brain)" stroke="#7a3f50" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 80,12 C 95,10 110,16 118,28 C 130,30 138,42 132,54 C 142,58 144,76 132,86 C 138,98 128,108 114,108 C 108,114 96,114 88,108 C 84,112 80,112 80,108 Z" fill="url(#brain)" stroke="#7a3f50" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 42,28 Q 47,22 53,28 Q 60,22 66,28 Q 73,22 80,28 Q 87,22 94,28 Q 100,22 107,28 Q 113,22 118,28" stroke="#7a3f50" stroke-width="1.6" fill="none" opacity="0.6"/>
  <path d="M 80,12 Q 79,40 80,72 Q 81,98 80,108" stroke="#7a3f50" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  <path d="M 32,48 Q 44,46 42,56 Q 30,60 38,70 Q 50,68 46,80" stroke="#7a3f50" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 50,42 Q 58,48 50,55" stroke="#7a3f50" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 62,82 Q 70,80 66,90" stroke="#7a3f50" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 128,48 Q 116,46 118,56 Q 130,60 122,70 Q 110,68 114,80" stroke="#7a3f50" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 110,42 Q 102,48 110,55" stroke="#7a3f50" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 98,82 Q 90,80 94,90" stroke="#7a3f50" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  <ellipse cx="56" cy="32" rx="18" ry="10" fill="white" opacity="0.32"/>
  <!-- Backpack straps drawn ON TOP of the brain (visible loops over the brain's outer-upper edges) -->
  <path d="M 28,54 Q 22,80 30,102 Q 36,112 46,114" stroke="#1c4f70" stroke-width="6.5" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 132,54 Q 138,80 130,102 Q 124,112 114,114" stroke="#1c4f70" stroke-width="6.5" fill="none" stroke-linecap="round" opacity="0.95"/>
  <!-- Strap inner highlight for depth -->
  <path d="M 28,58 Q 24,80 30,98" stroke="#5fb3d4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 132,58 Q 136,80 130,98" stroke="#5fb3d4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Eyes -->
  <circle cx="62" cy="60" r="9" fill="white" stroke="#7a3f50" stroke-width="1.2"/>
  <circle cx="98" cy="60" r="9" fill="white" stroke="#7a3f50" stroke-width="1.2"/>
  <circle cx="63" cy="61" r="4.5" fill="#222234"/>
  <circle cx="99" cy="61" r="4.5" fill="#222234"/>
  <circle cx="65" cy="58" r="1.8" fill="white"/>
  <circle cx="101" cy="58" r="1.8" fill="white"/>
  <!-- Smile -->
  <path d="M 66,86 Q 80,94 94,86" stroke="#7a3f50" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Tiny chibi arms emerging from shared shoulder coords (32,102) and (128,102) -->
  <path d="M 32,102 Q 20,116 16,132 Q 14,142 22,144 Q 28,142 28,132 Q 30,116 38,108 Z" fill="url(#brain)" stroke="#7a3f50" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="20" cy="142" r="5.5" fill="url(#brain)" stroke="#7a3f50" stroke-width="1.5"/>
  <path d="M 128,102 Q 140,116 144,132 Q 146,142 138,144 Q 132,142 132,132 Q 130,116 122,108 Z" fill="url(#brain)" stroke="#7a3f50" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="140" cy="142" r="5.5" fill="url(#brain)" stroke="#7a3f50" stroke-width="1.5"/>
  <!-- Tiny shorts/legs visible peeking under bag -->
  <rect x="62" y="146" width="36" height="14" rx="3" fill="url(#shorts)" stroke="#1c2f4d" stroke-width="1.4"/>
  <!-- Tiny stub legs and shoes -->
  <rect x="64" y="158" width="10" height="14" rx="3" fill="url(#brain)" stroke="#7a3f50" stroke-width="1.4"/>
  <rect x="86" y="158" width="10" height="14" rx="3" fill="url(#brain)" stroke="#7a3f50" stroke-width="1.4"/>
  <ellipse cx="68" cy="178" rx="11" ry="6" fill="#7a3f50" stroke="#3d1f28" stroke-width="1.4"/>
  <ellipse cx="92" cy="178" rx="11" ry="6" fill="#7a3f50" stroke="#3d1f28" stroke-width="1.4"/>
</svg>
