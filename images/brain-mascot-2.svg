<svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Stage 2: Schoolkid brain - wearing small backpack, slightly taller -->
  <defs>
    <radialGradient id="schoolBrainGradient" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#ff99cc" />
    </radialGradient>
  </defs>

  <!-- Backpack straps (behind brain) -->
  <rect x="42" y="45" width="4" height="35" rx="2" fill="#cc6633" opacity="0.8"/>
  <rect x="74" y="45" width="4" height="35" rx="2" fill="#cc6633" opacity="0.8"/>

  <!-- Main brain body - taller -->
  <ellipse cx="60" cy="55" rx="42" ry="46" fill="url(#schoolBrainGradient)" stroke="#ff66b3" stroke-width="2"/>

  <!-- Brain convolutions -->
  <path d="M 30 42 Q 36 37 42 42" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 78 42 Q 84 37 90 42" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 32 58 Q 40 53 48 58" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 72 58 Q 80 53 88 58" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>
  <path d="M 35 72 Q 43 68 51 72" fill="none" stroke="#ff66b3" stroke-width="1.5" opacity="0.6"/>

  <!-- Confident eyes -->
  <circle cx="46" cy="50" r="6" fill="white"/>
  <circle cx="74" cy="50" r="6" fill="white"/>
  <circle cx="46" cy="50" r="4" fill="#333"/>
  <circle cx="74" cy="50" r="4" fill="#333"/>
  <circle cx="48" cy="48" r="1.5" fill="white"/>
  <circle cx="76" cy="48" r="1.5" fill="white"/>

  <!-- Smile -->
  <path d="M 43 70 Q 60 75 77 70" fill="none" stroke="#ff66b3" stroke-width="2" stroke-linecap="round"/>

  <!-- Backpack (behind and lower) -->
  <g transform="translate(35, 80)">
    <rect x="0" y="0" width="50" height="40" rx="3" fill="#ff6633" stroke="#cc5522" stroke-width="2"/>
    <rect x="5" y="5" width="40" height="30" rx="2" fill="#ff8855" opacity="0.5"/>
    <circle cx="25" cy="35" r="3" fill="#cc5522"/>
  </g>
</svg>
